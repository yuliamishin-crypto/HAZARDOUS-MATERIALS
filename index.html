<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאגר חומרים מסוכנים - HAZMAT + PubChem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 { color: #1F4E78; font-size: 2.5em; }
        .subtitle { color: #666; font-size: 1.2em; margin-top: 10px; }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        #searchInput {
            flex: 1;
            min-width: 300px;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        select {
            padding: 12px 15px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            text-align: center;
            min-width: 150px;
        }

        .stat-number { font-size: 2em; font-weight: bold; }
        .stat-label { font-size: 0.9em; opacity: 0.9; }

        .results-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .chemical-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .chemical-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .chemical-card.pubchem { border-color: #28a745; background: #f0fff4; }
        .pubchem-badge {
            background: #28a745;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
            margin-right: 10px;
        }

        .name-heb { font-size: 1.4em; font-weight: bold; color: #1F4E78; margin-bottom: 5px; }
        .name-eng { color: #666; font-size: 1em; }
        .formula { font-size: 1.3em; font-weight: bold; color: #764ba2; }

        .chemical-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border-right: 4px solid #667eea;
        }

        .detail-label { font-weight: bold; color: #1F4E78; font-size: 0.9em; }
        .detail-value { color: #333; font-size: 1.1em; margin-top: 5px; }

        .loading { text-align: center; padding: 40px; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        .no-results { text-align: center; padding: 60px 20px; color: #666; }
        .no-results-icon { font-size: 4em; margin-bottom: 20px; }
    </style>
</head>

        let pubchemResults = [];

        // טען נתונים
        function init() {
            document.getElementById('totalCount').textContent = CHEMICALS_DATA.length;
            displayResults(CHEMICALS_DATA);
        }

        // חיפוש
        function search() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            const searchType = document.getElementById('searchType').value;

            if (!searchTerm) {
                displayResults(CHEMICALS_DATA);
                return;
            }

            // חפש במאגר
            let results = CHEMICALS_DATA.filter(c => {
                switch(searchType) {
                    case 'nameHeb': return c.nameHeb.toLowerCase().includes(searchTerm);
                    case 'nameEng': return c.nameEng.toLowerCase().includes(searchTerm);
                    case 'cas': return c.cas.includes(searchTerm);
                    default:
                        return c.nameHeb.toLowerCase().includes(searchTerm) ||
                               c.nameEng.toLowerCase().includes(searchTerm) ||
                               c.cas.includes(searchTerm);
                }
            });

            if (results.length === 0 && searchTerm.length > 2) {
                searchPubChem(searchTerm);
            } else {
                displayResults(results);
            }
        }

        // חיפוש ב-PubChem
        async function searchPubChem(query) {
            document.getElementById('resultsSection').innerHTML = `
                <div class="alert alert-info">
                    🔍 מחפש "${query}" ב-PubChem...
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            `;

            try {
                const url = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(query)}/JSON`;
                const response = await fetch(url);

                if (!response.ok) throw new Error('Not found');

                const data = await response.json();
                const compound = data.PC_Compounds[0];

                const result = {
                    nameEng: compound.id?.name || query,
                    nameHeb: query,
                    formula: extractFormula(compound),
                    cas: extractCAS(compound.props),
                    source: 'PubChem'
                };

                displayPubChemResult(result);

            } catch (error) {
                document.getElementById('resultsSection').innerHTML = `
                    <div class="alert alert-warning">
                        ❌ החומר "${query}" לא נמצא ב-PubChem.
                        <p>נסה לחפש בשם אנגלי או מספר CAS.</p>
                    </div>
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h2>לא נמצאו תוצאות</h2>
                    </div>
                `;
            }
        }

        // חלץ נוסחה
        function extractFormula(compound) {
            if (!compound.atoms) return '';
            const elements = {};
            compound.atoms.element.forEach(el => {
                const sym = getElementSymbol(el);
                elements[sym] = (elements[sym] || 0) + 1;
            });

            let formula = '';
            ['C','H','N','O','S','P','Cl','F','Br','I'].forEach(el => {
                if (elements[el]) {
                    formula += el + (elements[el] > 1 ? toSubscript(elements[el]) : '');
                    delete elements[el];
                }
            });
            return formula;
        }

        function getElementSymbol(n) {
            const e = {1:'H',6:'C',7:'N',8:'O',15:'P',16:'S',17:'Cl',9:'F',35:'Br',53:'I'};
            return e[n] || `[${n}]`;
        }

        function toSubscript(n) {
            return String(n).split('').map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('');
        }

        function extractCAS(props) {
            const cas = props?.find(p => p.urn?.label === 'CAS');
            return cas?.value?.sval || '';
        }

        // הצג תוצאת PubChem
        function displayPubChemResult(data) {
            document.getElementById('pubchemCount').textContent = '1';
            document.getElementById('resultCount').textContent = '1';

            document.getElementById('resultsSection').innerHTML = `
                <div class="alert alert-success">
                    ✅ נמצא ב-PubChem!
                </div>
                ${createCard(data, true)}
            `;
        }

        // הצג תוצאות
        function displayResults(data) {
            document.getElementById('resultCount').textContent = data.length;
            document.getElementById('pubchemCount').textContent = '0';

            if (data.length === 0) {
                document.getElementById('resultsSection').innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h2>לא נמצאו תוצאות</h2>
                    </div>
                `;
                return;
            }

            document.getElementById('resultsSection').innerHTML = data.map(c => createCard(c, false)).join('');
        }

        // יצירת כרטיס
        function createCard(c, isPubChem) {
            const badge = isPubChem ? '<span class="pubchem-badge">מ-PubChem</span>' : '';
            const cardClass = isPubChem ? 'chemical-card pubchem' : 'chemical-card';

            return `
                <div class="${cardClass}">
                    <div class="name-heb">${c.nameHeb} ${badge}</div>
                    <div class="name-eng">${c.nameEng}</div>
                    ${c.formula ? `<div class="formula">${c.formula}</div>` : ''}

                    <div class="chemical-details">
                        ${c.cas ? `<div class="detail-item"><div class="detail-label">CAS</div><div class="detail-value">${c.cas}</div></div>` : ''}
                        ${c.un ? `<div class="detail-item"><div class="detail-label">UN</div><div class="detail-value">${c.un}</div></div>` : ''}
                        ${c.nfpa30 ? `<div class="detail-item"><div class="detail-label">NFPA 30</div><div class="detail-value">${c.nfpa30}</div></div>` : ''}
                        ${c.flashPoint ? `<div class="detail-item"><div class="detail-label">נקודת הבזק</div><div class="detail-value">${c.flashPoint}°C</div></div>` : ''}
                    </div>
                </div>
            `;
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', search);
        document.getElementById('searchType').addEventListener('change', search);

        // התחל
        init();
    </script>
